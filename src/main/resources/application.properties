spring.application.name=task
spring.application.description=Task Scheduler - Task module

server.forward-headers-strategy = framework
server.port=8081

ts.scheduler.frequency=${TS_TASK_NOTIFICATION_TRIGGER_FREQUENCY:0 */2 * * * *}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.data.mongodb.uri=mongodb://${TS_MONGO_USER:dev_user}:${TS_MONGO_PASSWORD:devpass}@${TS_MONGO_HOST:localhost}:27017?authSource=admin
spring.data.mongodb.database=ts_task_scheduler
spring.data.mongodb.uuid-representation=standard

spring.rabbitmq.host=${TS_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${TS_RABBITMQ_TASK_USER:guest}
spring.rabbitmq.password=${TS_RABBITMQ_TASK_PASSWORD:guest}
spring.rabbitmq.virtual-host=${TS_RABBITMQ_VHOST:/}
