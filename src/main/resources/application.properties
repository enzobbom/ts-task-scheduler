spring.application.name=task-scheduler
spring.application.description=Task Scheduler - Task scheduler module

server.forward-headers-strategy = framework
server.port=8081

ts.scheduler.frequency=0 */2 * * * *

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=ts_task_scheduler
spring.data.mongodb.uuid-representation=standard

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}
